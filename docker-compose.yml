services:
  wholby-proxy:
    build: .
    container_name: wholby-proxy
    restart: unless-stopped
    ports:
      - "8096:8096"
    env_file:
      - .env
    volumes:
      # Saved sessions (so users stay logged in across restarts) and Wholphin display preferences.
      - ./data:/app/data
    # Optional: If running on the same machine as Emby,
    # setting network_mode to host can resolve routing issues.
    # network_mode: "host"
