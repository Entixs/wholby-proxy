# Example: publish the admin dashboard on its own hostname (never on the customer address).
# The dashboard itself listens on 127.0.0.1:8098 (ADMIN_PORT=8098 in .env).
# Needs the limit_req_zone below in nginx's http context (see nginx-http-context.conf).
#
#   limit_req_zone $binary_remote_addr zone=wholby_admin_login:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name wholby-admin.example.com;
    return 301 https://wholby-admin.example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name wholby-admin.example.com;
    ssl_certificate     /etc/letsencrypt/live/wholby-admin.example.com/fullchain.pem;  # or your own certificate
    ssl_certificate_key /etc/letsencrypt/live/wholby-admin.example.com/privkey.pem;

    access_log /var/log/nginx/wholby-admin.access.log wholby_notokens;
    error_log  /var/log/nginx/wholby-admin.error.log;

    client_max_body_size 8k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = /api/login {
        limit_req zone=wholby_admin_login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8098;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # Optional extra layer, for example only your own address:
    #   allow 203.0.113.7;
    #   deny all;

    location / {
        proxy_pass http://127.0.0.1:8098;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 30s;
    }
}
