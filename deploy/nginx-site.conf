server {
    listen 80;
    listen [::]:80;
    server_name emby.example.com;
    return 301 https://emby.example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name emby.example.com;
    ssl_certificate     /etc/letsencrypt/live/emby.example.com/fullchain.pem;  # or your own certificate
    ssl_certificate_key /etc/letsencrypt/live/emby.example.com/privkey.pem;

    access_log /var/log/nginx/emby.access.log wholby_notokens;
    error_log  /var/log/nginx/emby.error.log;

    client_max_body_size 10m;

    # Logins: rate limited. Anything over the burst gets 429.
    location = /Users/AuthenticateByName {
        limit_req zone=wholby_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8096;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Websocket (Wholphin display messages).
    location /socket {
        proxy_pass http://127.0.0.1:8096;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8096;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
