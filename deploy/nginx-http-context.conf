# Wholby Proxy (emby.example.com)

# Login attempts: 10 per minute per client IP (real IP is restored from Cloudflare in cloudflare-realip.conf).
limit_req_zone $binary_remote_addr zone=wholby_login:10m rate=10r/m;

# Log the path only. Query strings carry api_key / token values for images, subtitles and streams.
log_format wholby_notokens "$remote_addr [$time_local] \"$request_method $uri\" $status $body_bytes_sent";
